name: Verify LeadRescue
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --location --silent --show-error -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error -o /tmp/gitleaks-checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/gitleaks-checksums.txt)
          test -n "$expected"
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Redacted source, artifacts and complete available history scan
        run: |
          /tmp/gitleaks dir . --redact=100 --no-banner --log-level=warn
          /tmp/gitleaks git . --redact=100 --no-banner --log-level=warn --log-opts="--all"
      - name: Install test Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and HTTP security regressions with synthetic data
        run: |
          npm run dev > /tmp/leadrescue-ci.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid"' EXIT
          for n in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && break; sleep 1; done
          npm run test:e2e
