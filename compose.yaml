services:
  web:
    build:
      context: .
      target: web
    env_file: .env.local
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  worker:
    build:
      context: .
      target: worker
    env_file: .env.local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
